name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  # ── Unit tests (no external services required) ─────────────────────────────
  test:
    name: Build, Vet & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download modules
        working-directory: tms-backend
        run: go mod download

      - name: Build
        working-directory: tms-backend
        run: go build ./...

      - name: Vet
        working-directory: tms-backend
        run: go vet ./...

      - name: Unit tests (with race detector)
        working-directory: tms-backend
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"

  # ── Integration tests (spin up Postgres, Redis, Elasticsearch) ─────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms_password
          POSTGRES_DB: tms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6381:6381

      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports:
          - 9200:9200

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download modules
        working-directory: tms-backend
        run: go mod download

      - name: Integration tests
        working-directory: tms-backend
        run: go test -race -tags=integration -count=1 ./...
        env:
          CGO_ENABLED: "1"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms_password
          POSTGRES_DB: tms_test
          REDIS_HOST: localhost
          REDIS_PORT: 6381
          ES_NODE: http://localhost:9200
          SECRET_KEY: ci-test-secret-key-32-bytes-pad!
          REFRESH_SECRET: ci-test-refresh-secret-32-bytes!
          SECRET_KEY_EXPIRATION: "3600"
          REFRESH_SECRET_KEY_EXPIRATION: "86400"
